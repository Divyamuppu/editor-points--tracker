<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Editor Points Tracker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — left rail (desktop) / bottom bar (phone) → page header → hero summary → cards. Record-red accent, medal golds for rank, tier colours for rewards. */
:root{
  --bg:#07090C; --surface:#0E1116; --sunk:#151A21; --ink:#EEF4FA; --muted:#9AA6B2; --faint:#66727E; --line:#1E252E;
  --accent:#38BDF8; --accent-2:#7DD3FC; --accent-soft:#0B2533; --accent-ink:#04131B;
  --gold:#F5C451; --silver:#B8C2D0; --bronze:#E09A6B;
  --good:#34D399; --good-soft:#0D2A21; --warn:#FBBF24; --bad:#F87171;
  --t1:#2DD4BF; --t2:#A5B4C8; --t3:#F5C451; --t4:#A78BFA;
  --glow:56,189,248;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 48px -28px rgba(0,0,0,.8);
  --font-display:'Unbounded', 'Manrope', system-ui, sans-serif;
  --font-body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:16px; --r-sm:10px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.disp{font-family:var(--font-display);letter-spacing:-.02em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.app > div{min-width:0}
.rail{position:sticky;top:0;height:100vh;height:100dvh;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:18px;height:18px}
.brand b{display:block;font-family:var(--font-display);font-size:14px;font-weight:700;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--sunk)}
.me-card b{display:block;font-size:14px}
.me-card div span{font-size:12px;color:var(--muted)}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.dot.wait{background:var(--warn);box-shadow:none} .dot.off{background:var(--bad);box-shadow:none}

.mtop{display:none}
.bnav{display:none}

.page{min-width:0;padding:28px 40px 120px;max-width:none;width:100%;margin:0;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph h1{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;min-height:42px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .08s ease, background .15s ease}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.icon{padding:0;width:38px;min-height:38px}
.link{appearance:none;border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip svg.i{width:13px;height:13px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.tc{background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff!important;line-height:1;flex:none;background:linear-gradient(135deg,var(--a),var(--b))}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:19px}
.av.xl{width:68px;height:68px;font-size:22px}
.stack{display:flex}
.stack .av{border:2px solid var(--surface);margin-left:-8px}
.stack .av:first-child{margin-left:0}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--sunk);gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
select,input[type=text],input[type=url],input[type=number],input[type=date],input[type=password],input[type=email]{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;color:var(--ink);width:100%}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
.hint{font-weight:500;color:var(--faint)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-sm);background:var(--sunk);color:var(--muted);font-size:14px}
.banner.err{background:var(--accent-soft);color:var(--ink)}
.banner.good{background:var(--good-soft);color:var(--ink)}
.banner svg.i{margin-top:2px}
.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ico{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .ico svg.i{width:26px;height:26px}
.empty h3{font-size:19px;font-weight:800}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:18px;font-weight:800}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:28px;align-items:center;padding:24px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);pointer-events:none}
.hero .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1;letter-spacing:-.03em;margin:8px 0 6px}
.big small{font-size:18px;color:var(--muted);font-family:var(--font-body);font-weight:700;letter-spacing:0;margin-left:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.wd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-style:normal;color:var(--faint)}
.wd.on i{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.wd.today i{outline:2px dashed var(--accent);outline-offset:2px}
.wd.on.today i{outline-style:solid}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.ring .rc b{font-family:var(--font-display);font-size:15px}
.ring .rc span{font-size:11.5px;color:var(--muted);font-weight:700;max-width:90px;line-height:1.25}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .ki{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);color:var(--ink);flex:none}
.kpi .ki.acc{background:var(--accent-soft);color:var(--accent)}
.kpi .ki.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.kpi .ki.good{background:var(--good-soft);color:var(--good)}
.kpi b{display:block;font-family:var(--font-display);font-size:20px;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}

/* ---------- daily log ---------- */
.logbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.progress-pill{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.progress-pill .bar{width:120px}
.cuts{display:grid;gap:14px}
.cut{padding:18px 20px;display:grid;gap:16px;position:relative}
.cut::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.cut.todo::before{background:var(--accent)}
.cut.done::before{background:var(--good)}
.cut-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cut-h h3{font-size:16.5px;font-weight:800}
.cut-h .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:3px;align-items:center}
.cut-h .meta a{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.cut-h .meta svg.i{width:14px;height:14px}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mt{border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;background:var(--bg);display:flex;flex-direction:column;gap:2px;transition:border-color .15s, box-shadow .15s}
.mt:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.mt label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mt label svg.i{width:14px;height:14px}
.mt input{border:0;background:none;padding:0;min-height:0;font-family:var(--font-display);font-size:20px;font-weight:500;width:100%;box-shadow:none}
.mt input:focus{box-shadow:none}
.mt input::placeholder{color:var(--faint)}
.mt .d{font-size:11.5px;font-weight:700;color:var(--faint);min-height:16px}
.mt .d.up{color:var(--good)} .mt .d.down{color:var(--warn)}
.mt.dirty{border-color:var(--accent)}
.cut-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cut-f .last{font-size:13px;color:var(--muted)}
.gainpill{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--good);background:var(--good-soft);padding:6px 12px;border-radius:999px;font-size:13.5px}
.savebar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(24px);opacity:0;visibility:hidden;pointer-events:none;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 20px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.25);transition:transform .25s ease,opacity .25s ease,visibility .25s;font-weight:700}
.savebar.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.savebar .btn{min-height:40px}

/* ---------- leaderboard ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end}
.pd{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pd .nm{font-weight:800;font-size:16px}
.pd .pt{font-family:var(--font-display);font-size:22px;font-weight:700}
.pd .pt small{font-size:12px;color:var(--muted);font-family:var(--font-body)}
.pd .step{width:100%;border-radius:16px 16px 8px 8px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-family:var(--font-display);font-size:26px;font-weight:700;color:#fff}
.pd.p1 .step{height:120px;background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 70%,#000))}
.pd.p2 .step{height:88px;background:linear-gradient(180deg,var(--silver),color-mix(in srgb,var(--silver) 70%,#000))}
.pd.p3 .step{height:66px;background:linear-gradient(180deg,var(--bronze),color-mix(in srgb,var(--bronze) 70%,#000))}
.pd.p1 .av{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}
.lb{display:flex;flex-direction:column}
.lb details{border-bottom:1px solid var(--line)}
.lb details:last-child{border-bottom:0}
.lb summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1.3fr) 130px 110px 24px;gap:14px;align-items:center;padding:14px 20px;cursor:pointer}
.lb summary::-webkit-details-marker{display:none}
.lb summary:hover{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.lb details.me summary{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.lb .who{display:flex;align-items:center;gap:12px;min-width:0}
.lb .who b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .who .sub2{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.lb .tot{text-align:right;font-family:var(--font-display);font-size:18px;font-weight:700}
.lb .tod{text-align:right;font-weight:800;font-size:13.5px;color:var(--good)}
.lb .tod.zero{color:var(--faint)}
.lb .chev{color:var(--faint);transition:transform .2s}
.lb details[open] .chev{transform:rotate(90deg)}
.rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-display);font-size:14px;font-weight:700;background:var(--sunk);color:var(--muted)}
.rank.r1{background:var(--gold);color:#fff} .rank.r2{background:var(--silver);color:#fff} .rank.r3{background:var(--bronze);color:#fff}
.bd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:4px 20px 18px 78px}
.bd div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.bd span{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bd b{font-family:var(--font-display);font-size:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar .left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select{width:auto;min-width:180px}

/* ---------- projects ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{appearance:none;text-align:left;cursor:pointer;padding:18px;display:flex;flex-direction:column;gap:14px;transition:transform .12s ease,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.pcard h3{font-size:17px;font-weight:800}
.pcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.pstats b{display:block;font-family:var(--font-display);font-size:16px}
.pstats span{font-size:11.5px;font-weight:700;color:var(--muted)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(5,minmax(0,.7fr)) minmax(0,.8fr) auto;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.head{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:12px;padding-bottom:12px;background:var(--sunk);border-radius:var(--r) var(--r) 0 0}
.row .n{font-weight:700}
.row .ml{display:none;font-size:11px;color:var(--muted);font-weight:700}
.row.rw{grid-template-columns:44px minmax(0,1.5fr) 1fr 1fr 1fr}

/* ---------- rewards ---------- */
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tier{padding:18px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--tc)}
.tier .tn{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--tc)}
.tier .amt{font-family:var(--font-display);font-size:24px;font-weight:700}
.tier .need{font-size:13px;color:var(--muted);font-weight:600}
.tier .who{display:flex;gap:6px;flex-wrap:wrap;min-height:28px}

/* ---------- rules ---------- */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rules .card{padding:20px;display:flex;flex-direction:column;gap:12px}
.rules h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.rules h3 .ki{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.rules p{margin:0;color:var(--muted);font-size:14px}
.wl{display:flex;flex-direction:column}
.wl div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.wl div:last-child{border-bottom:0}
.wl b{font-weight:800}
.wl .tot{border-top:2px solid var(--ink);border-bottom:0;font-weight:800;margin-top:4px}

/* ---------- join ---------- */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%;max-width:760px;margin:0 auto}
.pick button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;font-weight:800;transition:transform .12s, border-color .15s}
.pick button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.pick button:disabled{opacity:.45;cursor:not-allowed}
.pick span.s{font-size:12px;font-weight:700;color:var(--muted)}

/* ---------- team ---------- */
.req{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.req:last-child{border-bottom:0}

/* ---------- Refined: calm typography, flat surfaces, sky blue as accent only ---------- */
:root{--font-display:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;--font-body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;--r:12px;--r-sm:8px;--shadow:none}
body{font-size:14px;line-height:1.5;font-synthesis:none;letter-spacing:-.003em;font-feature-settings:"ss01","cv11"}
.tnum,.kpi b,.big,.lb .tot,.lb .tod,.pd .pt,.tier .amt,.pstats b,.bd b,.mt input,.hrow .hp,.hbr b,.ring .rc b,.rank{font-variant-numeric:tabular-nums}
/* kill decorative effects */
.ph h1,.big,.kpi b,.lb .tot,.pd .pt,.tier .amt,.stat-card .v,.auth-hero h1{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:inherit;-webkit-text-fill-color:currentColor}
.hero::after,.auth-hero::after{display:none}
.wd.on i,.bar>i,.hbt i,.ok.y,.logo,.logo.light,.btn.primary,.pd.p1 .av,.name-chip[aria-pressed="true"],.pcard:hover{box-shadow:none!important}

/* shell */
.rail{padding:20px 14px;gap:20px;border-right:1px solid #161B22}

/* page head */
.page{gap:18px;padding:32px 40px 120px}

/* primitives */

/* leaderboard */
.podium{gap:12px}

.rank{width:26px;height:26px;border-radius:6px;font-family:var(--font-body);font-size:12px;font-weight:600}
.pstats b,.bd b{font-family:var(--font-body);font-weight:600;font-size:15px}
.tier .tn{font-family:var(--font-body);font-size:13px;font-weight:600}

.rules h3{font-size:14.5px;font-weight:600}

/* dialogs, toasts */
dialog{border-radius:14px}
.dlg-h h2{font-size:17px;font-weight:600;letter-spacing:-.015em}
.toast{border-radius:8px;font-weight:500;font-size:13.5px}
/* sign-in */
.auth-wrap{border-radius:16px}
.auth-hero h1{font-family:var(--font-body);font-size:30px;font-weight:600;letter-spacing:-.03em;color:#F8FAFC}

/* ---------- Landing / sign-in: full screen, animated stage ---------- */
body.auth #authRoot{display:block!important;padding:0!important;min-height:100vh;min-height:100dvh;background:#050608!important}
body.auth .auth-wrap{width:100%!important;max-width:none!important;min-height:100vh;min-height:100dvh;display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#050608!important;overflow:hidden}
/* hero stage */
body.auth .auth-hero{position:relative;display:grid!important;grid-template-rows:auto auto 1fr auto;gap:28px;padding:44px 56px!important;background:linear-gradient(150deg,#0B8FD6 0%,#2357E0 48%,#4637D8 100%)!important;border-right:0!important;overflow:hidden;isolation:isolate;animation:heroIn .7s cubic-bezier(.2,.8,.2,1) both}
.lp-bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.lp-bg .lp-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.lp-bg .lp-b1{width:520px;height:520px;left:-140px;top:-160px;background:#38BDF8;animation:drift1 18s ease-in-out infinite}
.lp-bg .lp-b2{width:460px;height:460px;right:-120px;bottom:-140px;background:#6D5BFF;animation:drift2 22s ease-in-out infinite}
.lp-bg .lp-b3{width:300px;height:300px;right:22%;top:30%;background:#22D3EE;opacity:.28;animation:drift1 26s ease-in-out infinite reverse}
.lp-bg .lp-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 60% 55%,#000 20%,transparent 72%);mask-image:radial-gradient(ellipse at 60% 55%,#000 20%,transparent 72%);animation:gridMove 30s linear infinite}
.hero-brand b{font-size:16px!important;color:#fff!important} .hero-brand span{color:rgba(255,255,255,.8)!important}
.hero-brand .logo{width:36px!important;height:36px!important;border-radius:10px!important;background:rgba(255,255,255,.16)!important;color:#fff!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)!important;backdrop-filter:blur(8px)}
.hero-copy{max-width:620px;animation:up .8s .15s cubic-bezier(.2,.8,.2,1) both}
.lp-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font-size:12.5px;font-weight:500;color:#fff;margin-bottom:18px;backdrop-filter:blur(8px)}
.lp-eyebrow i{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:live 2s infinite}
body.auth .auth-hero h1{font-size:clamp(38px,4.2vw,62px)!important;line-height:1.04!important;letter-spacing:-.04em!important;font-weight:600!important;color:#fff!important;margin:0 0 18px!important}
.lp-shine{background:linear-gradient(90deg,#fff 0%,#BAE6FD 30%,#fff 50%,#C7D2FE 70%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
body.auth .auth-hero p{font-size:clamp(15px,1.2vw,17.5px)!important;line-height:1.6;max-width:52ch!important;color:rgba(255,255,255,.85)!important;margin:0!important}
/* orbit: one shared animated angle keeps every avatar upright and in sync */
@property --lp-rot{syntax:'<angle>';inherits:true;initial-value:0deg}
.lp-stage{position:relative;justify-self:center;align-self:center;width:min(460px,100%);aspect-ratio:1;container-type:inline-size;animation:up .9s .25s cubic-bezier(.2,.8,.2,1) both}
.lp-orbit{position:absolute;inset:0;border-radius:50%}
.lp-orbit::before{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.26)}
.lp-out::before{inset:4%} .lp-in::before{inset:23%}
.lp-out{--R:46cqw;animation:lpSpin 80s linear infinite}
.lp-in{--R:27cqw;animation:lpSpinRev 50s linear infinite}
